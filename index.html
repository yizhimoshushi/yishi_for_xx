<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <!-- 添加 viewport-fit=cover 适配刘海屏/全面屏 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>启动动画</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        /* 禁止移动端默认的触摸高亮和长按菜单 */
        body {
            width: 100vw; height: 100vh; height: 100dvh; /* dvh 解决移动端地址栏问题 */
            overflow: hidden; cursor: default; user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation; /* 优化点击响应 */
            background:
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.05) 2px, rgba(0,0,0,0.05) 4px),
                repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(0,0,0,0.04) 2px, rgba(0,0,0,0.04) 4px),
                radial-gradient(ellipse at 30% 40%, #3a3a3a 0%, #2a2a2a 40%, #1a1a1a 70%, #111 100%);
            background-color: #222;
        }

        body::before {
            content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
            background: url("data:image/svg+xml,%3Csvg width='6' height='6' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='1' height='1' x='0' y='0' fill='rgba(255,255,255,0.02)'/%3E%3Crect width='1' height='1' x='3' y='3' fill='rgba(0,0,0,0.06)'/%3E%3C/svg%3E") repeat;
        }

        #hint {
            position: fixed; bottom: max(40px, env(safe-area-inset-bottom));
            left: 50%; transform: translateX(-50%);
            color: rgba(255,255,255,0.3); font-family: 'Georgia', serif; 
            font-size: clamp(12px, 3vmin, 14px); /* 响应式字号 */
            letter-spacing: 2px; transition: opacity 0.8s; z-index: 100;
            white-space: nowrap;
        }

        #candles { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
        .candle-wrapper { 
            position: absolute; display: flex; justify-content: center; align-items: flex-end; 
            /* 使用 vmin 确保在任何比例的屏幕上都能保持相对位置 */
        }
        
        /* ★ 核心修复：响应式布局定位 */
        .candle-wrapper:nth-child(1) { top: calc(50% - 12vmin); left: calc(50% - 22vmin); }
        .candle-wrapper:nth-child(2) { top: calc(50% - 12vmin); left: calc(50% + 22vmin); }
        .candle-wrapper:nth-child(3) { top: calc(50% + 18vmin); left: 50%; }

        .candle {
            position: absolute; 
            /* 蜡烛尺寸响应式 */
            width: clamp(10px, 2vmin, 14px); 
            height: clamp(40px, 9vmin, 60px);
            background: linear-gradient(90deg, #d8d0c4 0%, #f5f0e8 25%, #fff 50%, #f0ebe0 75%, #cdc5b8 100%);
            border-radius: 2px; z-index: 2; cursor: pointer; opacity: 0;
            transform: translateY(-30px);
            transition: opacity 0.5s ease-out, transform 0.5s ease-out;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        .candle.visible { opacity: 1; transform: translateY(0); }
        .candle.lit {
            background: linear-gradient(180deg, rgba(255,210,140,0.5) 0%, rgba(255,190,100,0.2) 20%, transparent 45%),
                linear-gradient(90deg, #d8d0c4 0%, #f5f0e8 25%, #fff 50%, #f0ebe0 75%, #cdc5b8 100%);
        }
        .candle.fierce {
            background: linear-gradient(180deg, rgba(255,180,80,0.7) 0%, rgba(255,120,30,0.3) 25%, transparent 55%),
                linear-gradient(90deg, #d8d0c4 0%, #f5f0e8 25%, #fff 50%, #f0ebe0 75%, #cdc5b8 100%);
        }

        .wick {
            position: absolute; top: -8px; left: 50%; transform: translateX(-50%);
            width: 2px; height: 8px; background: linear-gradient(to top, #444, #111);
            border-radius: 1px; transition: background 0.3s;
        }
        .candle.lit .wick { background: linear-gradient(to top, #cc4400, #333, #111); }

        .flame {
            position: absolute; left: 50%; z-index: 3; pointer-events: none;
            --fw: clamp(8px, 1.5vmin, 10px); 
            --fh: clamp(14px, 2.8vmin, 18px); 
            --ft: calc(var(--fh) * -1.5);
            --blur-outer: 1.2px; --bright-outer: 1.3;
            --blur-inner: 0.6px; --bright-inner: 1.4;
            --glow-spread: 4px; --glow-alpha: 0.6;
            width: var(--fw); height: var(--fh); top: var(--ft);
            transform: translateX(-50%) scale(0); opacity: 0;
            filter: drop-shadow(0 0 var(--glow-spread) rgba(255,160,50,var(--glow-alpha)));
            transition: opacity 0.4s ease, transform 0.5s cubic-bezier(0.34,1.56,0.64,1),
                width 0.7s ease, height 0.7s ease, top 0.7s ease, filter 0.7s ease;
        }
        .flame::before {
            content: ''; position: absolute; inset: 0;
            background: radial-gradient(ellipse at 50% 90%, #ffdd55 0%, #ffaa22 35%, #ff5500 65%, transparent 100%);
            border-radius: 50% 50% 20% 20% / 60% 60% 40% 40%;
            filter: blur(var(--blur-outer)) brightness(var(--bright-outer)); opacity: 0.95;
            animation: flameOuter 2s infinite ease-in-out alternate;
            animation-delay: var(--outer-delay, 0s);
            transition: filter 0.7s ease, background 0.7s ease;
        }
        .flame::after {
            content: ''; position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%);
            width: calc(var(--fw) * 0.5); height: calc(var(--fh) * 0.55);
            background: radial-gradient(ellipse at 50% 80%, #fff 0%, #cceeff 30%, #5599ff 70%, transparent 100%);
            border-radius: 50% 50% 30% 30% / 70% 70% 30% 30%;
            filter: blur(var(--blur-inner)) brightness(var(--bright-inner)); opacity: 1;
            animation: flameInner 1.8s infinite ease-in-out alternate-reverse;
            animation-delay: var(--inner-delay, -0.3s);
            transition: filter 0.7s ease, width 0.7s ease, height 0.7s ease, bottom 0.7s ease;
        }
        .candle.lit .flame { opacity: 1; transform: translateX(-50%) scale(1); }

        @keyframes flameOuter {
            0% { transform: scaleX(1) scaleY(1) skewX(0deg); }
            25% { transform: scaleX(0.92) scaleY(1.06) skewX(-1deg); }
            50% { transform: scaleX(1.04) scaleY(0.94) skewX(1.5deg); }
            75% { transform: scaleX(0.96) scaleY(1.03) skewX(-0.5deg); }
            100% { transform: scaleX(1.02) scaleY(0.97) skewX(0.8deg); }
        }
        @keyframes flameInner {
            0% { transform: translateX(-50%) scaleY(1); }
            50% { transform: translateX(-50%) scaleY(0.85); }
            100% { transform: translateX(-50%) scaleY(1.05); }
        }

        .candle.transitioning .flame {
            --fw: clamp(12px, 2.2vmin, 14px); --fh: clamp(22px, 4.5vmin, 28px); --ft: calc(var(--fh) * -1.2);
            --blur-outer: 1.8px; --bright-outer: 1.6;
            --blur-inner: 0.8px; --bright-inner: 1.7;
            --glow-spread: 8px; --glow-alpha: 0.85;
        }
        .candle.transitioning .flame::before { animation: flameTransitionOuter 0.75s ease-in-out infinite alternate; }
        .candle.transitioning .flame::after { animation: flameTransitionInner 0.75s ease-in-out infinite alternate; }

        @keyframes flameTransitionOuter {
            0% { transform: scaleX(1) scaleY(1) skewX(0deg) rotate(0deg); }
            30% { transform: scaleX(0.75) scaleY(1.35) skewX(-2deg) rotate(-1deg); }
            60% { transform: scaleX(1.2) scaleY(0.85) skewX(3deg) rotate(1.5deg); }
            100% { transform: scaleX(0.9) scaleY(1.15) skewX(-1.5deg) rotate(-0.5deg); }
        }
        @keyframes flameTransitionInner {
            0% { transform: translateX(-50%) scaleY(1) scaleX(1); }
            50% { transform: translateX(-50%) scaleY(1.3) scaleX(0.7); }
            100% { transform: translateX(-50%) scaleY(0.8) scaleX(1.2); }
        }

        .candle.fierce .flame {
            --fw: clamp(14px, 3vmin, 18px); --fh: clamp(28px, 6vmin, 36px); --ft: calc(var(--fh) * -1.1);
            --blur-outer: 2px; --bright-outer: 1.6;
            --blur-inner: 1px; --bright-inner: 2;
            --glow-spread: 12px; --glow-alpha: 1;
        }
        .candle.fierce .flame::before {
            background: radial-gradient(ellipse at 50% 85%, #ffe066 0%, #ffaa00 30%, #ff5500 60%, #cc2200 85%, transparent 100%);
            animation: fierceOuter 0.15s infinite linear;
        }
        .candle.fierce .flame::after {
            bottom: 4px;
            background: radial-gradient(ellipse at 50% 80%, #fff 0%, #bbddff 30%, #6699ff 70%, transparent 100%);
            animation: fierceInner 0.12s infinite linear;
        }
        @keyframes fierceOuter {
            0% { transform: scaleX(1) scaleY(1) skewX(0deg) rotate(0deg); }
            20% { transform: scaleX(0.8) scaleY(1.3) skewX(-4deg) rotate(-2deg); }
            40% { transform: scaleX(1.15) scaleY(0.85) skewX(3deg) rotate(1.5deg); }
            60% { transform: scaleX(0.85) scaleY(1.25) skewX(-2deg) rotate(-1deg); }
            80% { transform: scaleX(1.1) scaleY(0.9) skewX(5deg) rotate(2.5deg); }
            100% { transform: scaleX(0.9) scaleY(1.2) skewX(-3deg) rotate(-1.5deg); }
        }
        @keyframes fierceInner {
            0% { transform: translateX(-50%) scaleY(1) scaleX(1); }
            33% { transform: translateX(-52%) scaleY(0.7) scaleX(1.2); }
            66% { transform: translateX(-48%) scaleY(1.3) scaleX(0.8); }
            100% { transform: translateX(-50%) scaleY(0.8) scaleX(1.1); }
        }

        /* ★ 核心修复：消息框移动端适配 */
        .message {
            position: fixed; left: 50%; bottom: -80px; transform: translateX(-50%);
            font-family: 'Georgia', serif; 
            /* 响应式字号，最小16px防止过小，最大24px */
            font-size: clamp(16px, 5vmin, 24px); 
            color: rgba(255,255,255,0.9);
            text-shadow: 0 0 20px rgba(255,180,80,0.7), 0 0 60px rgba(255,120,0,0.3);
            opacity: 0; transition: bottom 1s ease, opacity 0.8s ease;
            z-index: 50; pointer-events: none; 
            /* 允许换行，居中显示，限制最大宽度 */
            white-space: normal; 
            text-align: center;
            width: 90vw;
            max-width: 600px;
            line-height: 1.5;
            padding: 0 10px;
        }
        .message.show { bottom: max(120px, 20vh); opacity: 1; }
        .message.hide { opacity: 0; bottom: max(160px, 25vh); }

        #fog {
            position: fixed; inset: 0; z-index: 200; pointer-events: none;
            opacity: 0; transition: opacity 3s ease;
        }
        #fog.active { opacity: 1; }
        .fog-layer {
            position: absolute; inset: -50%;
            background: radial-gradient(ellipse at 50% 50%, rgba(80,80,80,0.9) 0%, rgba(50,50,50,0.7) 40%, transparent 70%);
            animation: fogDrift 8s infinite ease-in-out alternate;
        }
        .fog-layer:nth-child(2) {
            background: radial-gradient(ellipse at 30% 60%, rgba(90,90,90,0.7) 0%, transparent 60%);
            animation: fogDrift2 10s infinite ease-in-out alternate; animation-delay: -3s;
        }
        .fog-layer:nth-child(3) {
            background: radial-gradient(ellipse at 70% 40%, rgba(70,70,70,0.8) 0%, transparent 55%);
            animation: fogDrift3 7s infinite ease-in-out alternate; animation-delay: -5s;
        }
        @keyframes fogDrift { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(30px,-20px) scale(1.1); } }
        @keyframes fogDrift2 { 0% { transform: translate(0,0) scale(1.05); } 100% { transform: translate(-40px,15px) scale(1.15); } }
        @keyframes fogDrift3 { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(20px,30px) scale(1.2); } }

        #table-light {
            position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0;
            transition: opacity 1.5s;
            background: radial-gradient(ellipse at 50% 50%, rgba(255,170,80,0.07) 0%, transparent 60%);
        }
        #table-light.on { opacity: 1; }
        #table-light.fierce { background: radial-gradient(ellipse at 50% 50%, rgba(255,130,40,0.22) 0%, transparent 50%); }
    </style>
</head>

<body>
    <div id="table-light"></div>
    <div id="candles">
        <div class="candle-wrapper"><div class="candle" id="c1"><div class="wick"></div><div class="flame"></div></div></div>
        <div class="candle-wrapper"><div class="candle" id="c2"><div class="wick"></div><div class="flame"></div></div></div>
        <div class="candle-wrapper"><div class="candle" id="c3"><div class="wick"></div><div class="flame"></div></div></div>
    </div>

    <div class="message" id="msg1">不属于这个时代的愚者啊</div>
    <div class="message" id="msg2">您是灰雾之上的神秘主宰</div>
    <div class="message" id="msg3">您是执掌好运的黄黑之王</div>
    <div class="message" id="msg4">我祈求您的注视</div>
    <div class="message" id="msg5">我祈求您的眷顾</div>
    <div class="message" id="msg6">我祈求您为我打开网站<br>https://yizhimoshushi.github.io/xx/</div>

    <div id="fog"><div class="fog-layer"></div><div class="fog-layer"></div><div class="fog-layer"></div></div>
    <div id="hint">点击屏幕进行仪式</div>

    <script>
        let stage = 0;
        const candles = [document.getElementById('c1'), document.getElementById('c2'), document.getElementById('c3')];
        const msgs = [
            document.getElementById('msg1'),
            document.getElementById('msg2'),
            document.getElementById('msg3'),
            document.getElementById('msg4'),
            document.getElementById('msg5'),
            document.getElementById('msg6')
        ];
        const fog = document.getElementById('fog');
        const hint = document.getElementById('hint');
        const tableLight = document.getElementById('table-light');

        const sleep = ms => new Promise(r => setTimeout(r, ms));

        const FIERCE_DELAYS = [0, 300, 650];
        const TRANSITION_DURATION = 750;
        const TARGET_URL = "https://yizhimoshushi.github.io/xx/";

        function triggerFierceFlames() {
            candles.forEach((c, i) => {
                setTimeout(() => {
                    c.classList.add('transitioning');
                    setTimeout(() => {
                        c.classList.remove('transitioning');
                        c.classList.add('fierce');
                    }, TRANSITION_DURATION);
                }, FIERCE_DELAYS[i]);
            });
            const maxDelay = Math.max(...FIERCE_DELAYS) + TRANSITION_DURATION;
            setTimeout(() => {
                tableLight.classList.add('fierce');
            }, maxDelay);
        }

        async function showMessage(msgEl, displayTime = 1600) {
            msgEl.classList.add('show');
            await sleep(displayTime);
            msgEl.classList.remove('show');
            msgEl.classList.add('hide');
            await sleep(100);
        }

        // 同时监听 click 和 touchend 以确保移动端即时响应
        const handleInteraction = async (e) => {
            // 防止 touchend 和 click 双重触发
            if (e.type === 'touchend') {
                e.preventDefault(); 
            }
            
            stage++;

            if (stage === 1) {
                hint.textContent = '';
                hint.style.opacity = '0';
                for (const c of candles) {
                    c.classList.add('visible');
                    await sleep(400);
                }
                hint.textContent = '点击点燃蜡烛…';
                hint.style.opacity = '1';
            }
            else if (stage === 2) {
                hint.style.opacity = '0';
                for (const c of candles) {
                    c.classList.add('lit');
                    const flame = c.querySelector('.flame');
                    const outerDelay = (Math.random() * -2).toFixed(2) + 's';
                    const innerDelay = (parseFloat(outerDelay) - 0.3 - Math.random() * 0.5).toFixed(2) + 's';
                    flame.style.setProperty('--outer-delay', outerDelay);
                    flame.style.setProperty('--inner-delay', innerDelay);
                    await sleep(500);
                }
                tableLight.classList.add('on');
                hint.textContent = '再次点击开始仪式…';
                hint.style.opacity = '1';
            }
            else if (stage === 3) {
                hint.style.opacity = '0';

                await showMessage(msgs[0]);
                await showMessage(msgs[1]);
                await showMessage(msgs[2]);

                triggerFierceFlames();

                await showMessage(msgs[3]);
                await showMessage(msgs[4]);
                // URL较长，移动端多给一点阅读时间
                await showMessage(msgs[5], 2500);

                await sleep(700);
                fog.classList.add('active');

                await sleep(3000);
                window.location.href = TARGET_URL;
            }
        };

        document.body.addEventListener('click', handleInteraction);
        document.body.addEventListener('touchend', handleInteraction, { passive: false });
    </script>
</body>
</html>
